[package]
name = "lueur"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-2.0-or-later"
description = "Contrôleur RGB ultra-léger pour Windows : effets exécutés par le matériel, 0 % de CPU au repos."
repository = "https://github.com/Renan-projects/lueur"
readme = "README.md"
keywords = ["rgb", "led", "aura", "openrgb", "signalrgb"]
categories = ["hardware-support"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
